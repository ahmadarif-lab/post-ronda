[package]
name = "post-ronda"
version = "0.2.1"
edition = "2024"
description = "A fast, native, local-first API client. No account needed."
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
rfd = "0.17"
url = "2"
tempfile = "3"
image = {version = "0.25",default-features = false,features=["png"]}

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false
debug = 0
panic = "abort"

[build-dependencies]
winresource = "0.1"
